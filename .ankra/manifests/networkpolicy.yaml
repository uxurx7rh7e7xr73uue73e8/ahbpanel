apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ahbpanel
  labels:
    app.kubernetes.io/name: ahbpanel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ahbpanel
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - ports:
        - port: 8000
          protocol: TCP
